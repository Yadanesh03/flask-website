<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Creative Profile</title>
    <style>
        /* This CSS makes the page look good */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { margin-bottom: 10px; color: #2d3748; }
        p { color: #718096; line-height: 1.6; }
        .tag {
            display: inline-block;
            background: #e2e8f0;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            margin: 5px;
            color: #4a5568;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #5a67d8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Alex Developer</h1>
        <p>Creative thinker & Digital Explorer. I love building things that live on the internet.</p>
        
        <div class="skills">
            <span class="tag">Photography</span>
            <span class="tag">Design</span>
            <span class="tag">Travel</span>
        </div>

        <a href="mailto:email@example.com" class="btn">Contact Me</a>
    </div>
</body>
</html>
